apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-postgres
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    app.kubernetes.io/name: keycloak-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.keycloak.postgres.image.repository }}:{{ .Values.keycloak.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.postgres.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: {{ .Values.keycloak.postgres.database | quote }}
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: POSTGRESQL_PASSWORD
          startupProbe:
            tcpSocket:
              port: postgresql
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: postgresql
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            {{- toYaml .Values.keycloak.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres
  namespace: {{ .Values.keycloak.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.keycloak.postgres.storage.size }}
  {{- with .Values.keycloak.postgres.storage.className }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  namespace: {{ .Values.keycloak.namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
