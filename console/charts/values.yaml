console:
  namespace: console

  app:
    name: console
    # Built from console/apps/web with the VITE_* build args (gateway URL,
    # OIDC issuer, client ID).
    image:
      repository: quay.io/redhat-user-workloads/rosa-tenant/rosa-seaplane-api-console
      tag: "latest"
      pullPolicy: Always

    replicas: 1

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi

  service:
    port: 8080

  # Runtime configuration served as /config.js (deploy-time, not baked
  # into the image — one image serves every environment). apiBaseUrl and
  # oidcIssuer come from terraform outputs via ApplicationSet annotations;
  # oidcClientId is the public PKCE client configured on the Keycloak realm.
  config:
    apiBaseUrl: ""
    oidcIssuer: ""
    oidcClientId: ""

  # TargetGroupBinding onto the console ALB target group created by the
  # custom-authorizer-gateway terraform module (rosa-seaplane).
  targetGroup:
    arn: ""
    targetType: ip
