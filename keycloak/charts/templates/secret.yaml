{{- if .Values.keycloak.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: {{ .Values.keycloak.namespace }}
  annotations:
    # PoC bootstrap credentials only — disable createSecret and manage this
    # Secret via external-secrets for anything beyond the PoC.
    seaplane.io/poc-only: "true"
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ required "keycloak.adminUsername is required when createSecret=true" .Values.keycloak.adminUsername | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "keycloak.adminPassword is required when createSecret=true" .Values.keycloak.adminPassword | quote }}
  POSTGRESQL_USER: {{ .Values.keycloak.postgresUsername | quote }}
  POSTGRESQL_PASSWORD: {{ required "keycloak.postgresPassword is required when createSecret=true" .Values.keycloak.postgresPassword | quote }}
{{- end }}
