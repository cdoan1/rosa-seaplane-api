# Client protocol as seen by the edge: use the forwarded header when present
# (e.g. OpenShift router), otherwise assume https (TLS terminated upstream).
map $http_x_forwarded_proto $xfp {
    default $http_x_forwarded_proto;
    ""      "https";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;


    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
